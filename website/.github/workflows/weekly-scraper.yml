name: Weekly Market Intelligence Scraper

on:
  schedule:
    # Monday 6:00 AM Central Time (UTC-5/6) = 11:00 AM UTC
    - cron: '0 11 * * 1'
  workflow_dispatch: # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Run scraper
        run: cd website && npx tsx scripts/run-scraper.ts
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_intelligence/ website/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            SUMMARY_FILE="market_intelligence/.last_run_summary"
            if [ -f "$SUMMARY_FILE" ]; then
              RUN_DATE=$(grep '^date=' "$SUMMARY_FILE" | cut -d= -f2)
              POST_COUNT=$(grep '^posts=' "$SUMMARY_FILE" | cut -d= -f2)
              git commit -m "Scraper run ${RUN_DATE} — ${POST_COUNT} posts"
            else
              git commit -m "Scraper run $(date -u +%Y-%m-%d)"
            fi
            git push
          fi
