<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer hexagon — black outline behind green -->
  <polygon points="32,6 54,17 54,39 32,50 10,39 10,17" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
  <polygon points="32,6 54,17 54,39 32,50 10,39 10,17" fill="none" stroke="#00ff41" stroke-width="2.5"/>
  <!-- Inner hexagon — black outline behind green -->
  <polygon points="32,14 46,21.5 46,36.5 32,44 18,36.5 18,21.5" fill="none" stroke="#1a1a1a" stroke-width="2.5" opacity="0.6"/>
  <polygon points="32,14 46,21.5 46,36.5 32,44 18,36.5 18,21.5" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.6"/>
  <!-- Bold V shape — black outline behind green -->
