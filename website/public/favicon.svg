  <polyline points="20,20 32,40 44,20" fill="none" stroke="#00ff41" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Node dots — black outline behind green -->
  <circle cx="32" cy="6" r="2.8" fill="#1a1a1a"/>
  <circle cx="54" cy="17" r="2.8" fill="#1a1a1a"/>
  <circle cx="54" cy="39" r="2.8" fill="#1a1a1a"/>
  <circle cx="32" cy="50" r="2.8" fill="#1a1a1a"/>
  <circle cx="10" cy="39" r="2.8" fill="#1a1a1a"/>
  <circle cx="10" cy="17" r="2.8" fill="#1a1a1a"/>
  <circle cx="32" cy="6" r="2" fill="#00ff41"/>
  <circle cx="54" cy="17" r="2" fill="#00ff41"/>
  <circle cx="54" cy="39" r="2" fill="#00ff41"/>
  <circle cx="32" cy="50" r="2" fill="#00ff41"/>
  <circle cx="10" cy="39" r="2" fill="#00ff41"/>
  <circle cx="10" cy="17" r="2" fill="#00ff41"/>
</svg>
