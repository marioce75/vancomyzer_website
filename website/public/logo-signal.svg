<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer pentagon — 5 dimensions of the evaluation framework -->
  <polygon points="32,6 57,24 47,53 17,53 7,24" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="32,6 57,24 47,53 17,53 7,24" fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner pentagon -->
  <polygon points="32,14 49,26 43,47 21,47 15,26" fill="none" stroke="#1a1a1a" stroke-width="2.5" opacity="0.6" stroke-linejoin="round"/>
  <polygon points="32,14 49,26 43,47 21,47 15,26" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.6" stroke-linejoin="round"/>
  <!-- Bold V shape -->
  <polyline points="22,22 32,42 42,22" fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <polyline points="22,22 32,42 42,22" fill="none" stroke="#00d4aa" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- 5 node dots — one per evaluation dimension -->
  <circle cx="32" cy="6" r="2.8" fill="#1a1a1a"/>
  <circle cx="57" cy="24" r="2.8" fill="#1a1a1a"/>
  <circle cx="47" cy="53" r="2.8" fill="#1a1a1a"/>
  <circle cx="17" cy="53" r="2.8" fill="#1a1a1a"/>
  <circle cx="7" cy="24" r="2.8" fill="#1a1a1a"/>
  <circle cx="32" cy="6" r="2" fill="#00d4aa"/>
  <circle cx="57" cy="24" r="2" fill="#00d4aa"/>
  <circle cx="47" cy="53" r="2" fill="#00d4aa"/>
  <circle cx="17" cy="53" r="2" fill="#00d4aa"/>
  <circle cx="7" cy="24" r="2" fill="#00d4aa"/>
</svg>
